# Hermes as a pluggable runtime under evaluation (Work Plan v2, next step 05).
# It may reach Cellertz only through the MCP: no terminal, files or web, and
# no memory of its own to compete with the Second Brain.
model:
  default: "nvidia/nemotron-3.5-lightning:free"
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"

# Hermes falls back to a paid model for its own background tasks unless told not to.
auxiliary:
  free_only: true

# The caller names the model (the admin's choice); without this Hermes
# silently runs its default and reports the requested name.
platforms:
  api_server:
    extra:
      direct_model_requests: true

skills:
  creation_nudge_interval: 0

memory:
  memory_enabled: false
  user_profile_enabled: false

platform_toolsets:
  api_server: [cellertz]

mcp_servers:
  cellertz:
    url: http://cellertz-mcp:8000/mcp
