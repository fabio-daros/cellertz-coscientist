services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cellertz-ai-coscientist

    working_dir: /workspace

    volumes:
      - .:/workspace

    stdin_open: true
    tty: true

    command: bash

  hermes:
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: cellertz-hermes

    restart: unless-stopped

    command:
      - gateway
      - run

    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"

    volumes:
      - hermes_data:/opt/data

    ports:
      - "127.0.0.1:8642:8642"

    depends_on:
      cellertz-mcp:
        condition: service_healthy

  cellertz-mcp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cellertz-mcp

    working_dir: /workspace

    volumes:
      - .:/workspace

    command: ["python", "-m", "cellertz.mcp.server"]

    environment:
      CELLERTZ_MCP_MUTATION_MODE: fixture_only
      CELLERTZ_RUN_STATE_ROOT: /workspace/outputs/runs
      CELLERTZ_RUN_ARTIFACT_ROOT: /workspace/outputs/runs
      CELLERTZ_IDEMPOTENCY_ROOT: /workspace/outputs/idempotency
      CELLERTZ_SECOND_BRAIN_ROOT: /workspace/second_brain

    restart: unless-stopped

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  hermes_data:
